<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人工作台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ======================= 登录页 ======================= -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="login-logo">个人工作台</div>
      <div class="login-tabs">
        <button class="tab active" data-tab="login">登 录</button>
        <button class="tab" data-tab="register">注 册</button>
      </div>

      <form id="loginForm" class="form">
        <div class="form-group">
          <label>账号</label>
          <input type="text" name="username" placeholder="请输入账号" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <div class="form-err error" id="loginError"></div>
      </form>

      <form id="registerForm" class="form" style="display:none">
        <div class="form-group">
          <label>姓名</label>
          <input type="text" name="display_name" placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label>账号</label>
          <input type="text" name="username" placeholder="请设置账号" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" name="password" placeholder="至少4位" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">注 册</button>
        <div class="form-err error" id="registerError"></div>
      </form>
    </div>
  </div>

  <!-- ======================= 主工作台 ======================= -->
  <div id="appView" class="app-view" style="display:none">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-title">个人工作台</div>
      <div class="topbar-user">
        <div class="avatar" id="avatarBtn"><span id="avatarText"></span></div>
        <div class="user-menu" id="userMenu" style="display:none">
          <div class="menu-item">当前账号：<b id="menuUsername"></b></div>
          <div class="menu-item">姓名：<b id="menuDisplay"></b></div>
          <div class="menu-divider"></div>
          <div class="menu-item clickable" id="menuViewPwd">查看密码</div>
          <div class="menu-item clickable" id="menuChangePwd">修改密码</div>
          <div class="menu-divider"></div>
          <div class="menu-item clickable danger" id="menuLogout">退出登录</div>
        </div>
      </div>
    </header>

    <!-- 主体：三面板 -->
    <main class="workspace" id="workspace">
      <!-- 上半区：左纪要 + 右日程 -->
      <div class="top-area" id="topArea">
        <section class="panel panel-meeting" id="meetingPanel">
          <div class="panel-head">
            <span class="panel-title">📝 会议纪要</span>
            <button class="btn btn-sm" id="btnNewMeeting">＋ 新增记录</button>
          </div>
          <div class="panel-body">
            <div class="meeting-table-wrap">
              <table class="meeting-table">
                <thead>
                  <tr>
                    <th>主题</th>
                    <th>会议时间</th>
                    <th>参会人员</th>
                    <th>问题</th>
                    <th>方案</th>
                    <th>责任人</th>
                    <th>是否解决</th>
                    <th id="mtdyn"></th>
                  </tr>
                </thead>
                <tbody id="meetingRows"></tbody>
              </table>
            </div>
            <div class="empty-tip" id="meetingEmpty">暂无会议纪要，点击右上角「新增记录」</div>
          </div>
        </section>

        <div class="v-divider" id="vDivider"></div>

        <section class="panel panel-schedule" id="schedulePanel">
          <div class="panel-head">
            <span class="panel-title">📅 日程表（近三周）</span>
            <button class="btn btn-sm" id="btnNewSchedule">＋ 创建日程</button>
          </div>
          <div class="panel-body">
            <div class="schedule-week" id="scheduleWeek"></div>
          </div>
        </section>
      </div>

      <div class="h-divider" id="hDivider"></div>

      <!-- 下半区：看板 -->
      <section class="panel panel-board" id="boardPanel">
        <div class="panel-head">
          <span class="panel-title">🗂 看板任务</span>
          <button class="btn btn-sm" id="btnNewColumn">＋ 新建列表</button>
        </div>
        <div class="panel-body">
          <div class="board-scroll" id="boardScroll">
            <div class="board-columns" id="boardColumns"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ======================= 通用弹窗容器 ======================= -->
  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modalBox"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
